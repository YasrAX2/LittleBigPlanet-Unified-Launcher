name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --bundles nsis
      - name: Portable package and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/portable | Out-Null
          Copy-Item src-tauri/target/release/patchwork-pod.exe release/portable/
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md,THIRD-PARTY-LICENSES.txt,docs/IMAGE-SOURCES.md release/portable/
          Compress-Archive release/portable/* release/Patchwork-Pod-Windows-x64.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release/
          Get-ChildItem release -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-debug-test-build
          path: src-tauri/target/debug/patchwork-pod.exe
          if-no-files-found: ignore
