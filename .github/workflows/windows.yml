name: Windows build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python scripts/check_npm_audit.py
      - run: python scripts/check_dependencies.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --bundles nsis
      - name: Portable package and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/portable | Out-Null
          Copy-Item src-tauri/target/release/patchwork-pod.exe release/portable/
          Copy-Item README.md,LICENSE,PRIVACY.md,THIRD-PARTY-NOTICES.md,THIRD-PARTY-LICENSES.txt,docs/IMAGE-SOURCES.md,docs/VIDEO.md,docs/NATIVE-TESTING.md release/portable/
          Copy-Item docs release/portable/docs -Recurse
          Compress-Archive release/portable/* release/Patchwork-Pod-Windows-x64.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release/
          Get-ChildItem release -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-debug-test-build
          path: src-tauri/target/debug/patchwork-pod.exe
          if-no-files-found: ignore
