[package]
name = "patchwork-pod"
version = "1.2.0"
description = "An unofficial, handcrafted LittleBigPlanet unified launcher"
authors = ["Patchwork Pod contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
rfd = "0.15"
base64 = "0.22"
tempfile = "3"
serde_yaml = "0.9"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
